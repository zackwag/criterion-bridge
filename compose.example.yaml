services:
  criterion-bridge:
    image: zackwag/criterion-bridge:latest
    container_name: criterion-bridge
    restart: unless-stopped
    ports:
      # The host port, from CRITERION_BRIDGE_PORT in .env, or 8080.
      - "${CRITERION_BRIDGE_PORT:-8080}:8080"
    environment:
      # Your Criterion Channel sign-in, from .env next to this file.
      - CRITERION_EMAIL=${CRITERION_EMAIL}
      - CRITERION_PASSWORD=${CRITERION_PASSWORD}
      # Optional: a TMDB API key, for portrait posters in the guide.
      - TMDB_API_KEY=${TMDB_API_KEY:-}
